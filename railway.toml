[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn backend.app:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# IMPORTANT: Attach a persistent volume in Railway dashboard:
#   Mount path: /data
#   Then set environment variable: DATABASE_PATH=/data/coach.db
# This ensures SQLite data survives container restarts and redeployments.
