{% extends "base.html" %}
{% block title %}Coach — Race Calendar{% endblock %}

{% block content %}
<div class="flex-between mb-md">
    <h1>Race Calendar</h1>
    <button class="btn btn-primary btn-sm" id="add-race">Add Race</button>
</div>

<!-- Add/Edit race modal (inline) -->
<div class="card hidden" id="race-form-card">
    <form id="race-form">
        <input type="hidden" name="id" id="race-id">
        <div class="grid grid-2">
            <div class="form-group">
                <label class="form-label">Race Name</label>
                <input type="text" class="form-input" name="name" required>
            </div>
            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" class="form-input" name="date" required>
            </div>
            <div class="form-group">
                <label class="form-label">Distance</label>
                <select class="form-select" name="distance_label">
                    <option value="5k">5K</option>
                    <option value="10k">10K</option>
                    <option value="half_marathon">Half Marathon</option>
                    <option value="marathon">Marathon</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Priority</label>
                <select class="form-select" name="priority" required>
                    <option value="A">A — Primary goal</option>
                    <option value="B">B — Important</option>
                    <option value="C">C — Training race</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Goal Notes</label>
                <input type="text" class="form-input" name="goal_notes" placeholder="e.g. sub-40">
            </div>
            <div class="form-group">
                <label class="form-label">Discipline</label>
                <select class="form-select" name="discipline">
                    <option value="running">Running</option>
                    <option value="cycling">Cycling</option>
                    <option value="triathlon">Triathlon</option>
                </select>
            </div>
        </div>
        <div class="flex gap-sm mt-md">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" id="cancel-race">Cancel</button>
        </div>
    </form>
</div>

<!-- Race list -->
<div id="race-list">
    <div class="loading">Loading races...</div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/pages/races.js"></script>
{% endblock %}
