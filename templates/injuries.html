{% extends "base.html" %}
{% block title %}Coach — Injury Log{% endblock %}

{% block content %}
<div class="flex-between mb-md">
    <h1>Injury Log</h1>
    <button class="btn btn-primary btn-sm" id="add-injury">Log Injury</button>
</div>

<!-- Add/Edit injury form -->
<div class="card hidden" id="injury-form-card">
    <form id="injury-form">
        <input type="hidden" name="id" id="injury-id">
        <div class="grid grid-2">
            <div class="form-group">
                <label class="form-label">Body Part</label>
                <input type="text" class="form-input" name="body_part" placeholder="e.g. right knee" required>
            </div>
            <div class="form-group">
                <label class="form-label">Onset Date</label>
                <input type="date" class="form-input" name="onset_date" required>
            </div>
            <div class="form-group">
                <label class="form-label">Severity (1-10)</label>
                <div class="range-group">
                    <input type="range" id="severity" name="severity" min="1" max="10" value="5">
                    <span class="range-value" id="severity-val">5</span>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="active">Active</option>
                    <option value="monitoring">Monitoring</option>
                    <option value="resolved">Resolved</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" name="description" required></textarea>
        </div>
        <div class="flex gap-sm mt-md">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" id="cancel-injury">Cancel</button>
        </div>
    </form>
</div>

<!-- Active injuries -->
<div id="injury-list">
    <div class="loading">Loading injuries...</div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/pages/injuries.js"></script>
{% endblock %}
